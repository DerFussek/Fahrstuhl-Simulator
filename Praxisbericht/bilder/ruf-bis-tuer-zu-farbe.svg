  <path transform="translate(410 502)" d="M 0 4 L 55 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <path transform="translate(256 568)" d="M 4 0 L 4 31" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
