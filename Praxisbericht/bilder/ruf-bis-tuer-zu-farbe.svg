<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1170" viewBox="0 0 1280 1170" font-family="Calibri, Carlito, Arial, sans-serif" fill="#333333">
  <title>Ablauf vom Ruf bis zur Fahrfreigabe</title>
  <defs>
    <marker id="pfeil" orient="auto" markerUnits="strokeWidth" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible">
      <path d="M0 0 L4 2 L0 4 Z" fill="#333333" stroke="none"/>
    </marker>
  </defs>
  <rect width="1280" height="1170" fill="#ffffff"/>
  <rect x="41" y="25" width="618" height="42" rx="5" fill="#cfe1f5" stroke="#1f5fa8" stroke-width="2"/>
  <text x="350" y="51" text-anchor="middle" font-size="22"><tspan font-weight="bold" fill="#111111">TD_Gondel mit AddTargetToList</tspan></text>
  <rect x="701" y="25" width="538" height="42" rx="5" fill="#ffe1bd" stroke="#c26a00" stroke-width="2"/>
  <text x="970" y="51" text-anchor="middle" font-size="22"><tspan font-weight="bold" fill="#111111">DT_Door</tspan></text>
  <line x1="680" y1="24" x2="680" y2="844" stroke="#8c8c8c" stroke-width="2" stroke-dasharray="8 5"/>
  <circle cx="260" cy="104" r="10" fill="#222222"/>
