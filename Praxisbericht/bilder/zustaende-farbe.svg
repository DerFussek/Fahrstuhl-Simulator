<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="Calibri, Carlito, Arial, sans-serif" fill="#333333">
  <title>Zustände der Aufzugssteuerung</title>
  <defs>
    <marker id="pfeil" orient="auto" markerUnits="strokeWidth" markerWidth="5" markerHeight="5" refX="2" refY="2" overflow="visible">
      <path d="M0 0 L4 2 L0 4 Z" fill="#333333" stroke="none"/>
    </marker>
  </defs>
  <rect width="1280" height="780" fill="#ffffff"/>
  <path transform="translate(186 74)" d="M 4 0 L 4 41" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <path transform="translate(320 153)" d="M 0 4 L 635 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <path transform="translate(320 191)" d="M 0 4 L 560 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path transform="translate(876 195)" d="M 4 0 L 4 282" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
