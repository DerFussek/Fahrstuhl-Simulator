  <path transform="translate(1086 232)" d="M 4 0 L 4 203" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <path transform="translate(771 511)" d="M 189 4 L 4 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <path transform="translate(321 492)" d="M 189 4 L 4 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <path transform="translate(186 233)" d="M 4 207 L 4 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <path transform="translate(186 552)" d="M 4 0 L 4 64" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path transform="translate(190 612)" d="M 0 4 L 900 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path transform="translate(1086 553)" d="M 4 63 L 4 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <path transform="translate(30 492)" d="M 30 4 L 0 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path transform="translate(26 40)" d="M 4 456 L 4 0" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path transform="translate(30 36)" d="M 0 4 L 1060 4" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path transform="translate(1086 40)" d="M 4 0 L 4 75" fill="none" stroke="#333333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pfeil)"/>
  <circle cx="190" cy="64" r="10" fill="#222222"/>
  <rect x="61" y="121" width="258" height="110" rx="27" fill="#e3eefa" stroke="#1f5fa8" stroke-width="2"/>
  <text x="190" y="157" text-anchor="middle" font-size="22"><tspan font-weight="bold" fill="#111111">Leerlauf</tspan></text>
  <text x="190" y="181" text-anchor="middle" font-size="18"><tspan fill="#333333">Tür zu, Gondel steht</tspan></text>
  <text x="190" y="205" text-anchor="middle" font-size="18"><tspan fill="#333333">(EndlageZu)</tspan></text>
  <rect x="961" y="121" width="258" height="110" rx="27" fill="#e3eefa" stroke="#1f5fa8" stroke-width="2"/>
  <text x="1090" y="157" text-anchor="middle" font-size="22"><tspan font-weight="bold" fill="#111111">Fahren</tspan></text>
  <text x="1090" y="181" text-anchor="middle" font-size="18"><tspan fill="#333333">Enable = 1, Motor fährt</tspan></text>
  <text x="1090" y="205" text-anchor="middle" font-size="18"><tspan fill="#333333">10 px je Zyklus</tspan></text>
  <rect x="961" y="441" width="258" height="110" rx="27" fill="#fff0dc" stroke="#c26a00" stroke-width="2"/>
  <text x="1090" y="477" text-anchor="middle" font-size="22"><tspan font-weight="bold" fill="#111111">Tür öffnet</tspan></text>
  <text x="1090" y="501" text-anchor="middle" font-size="18"><tspan fill="#333333">Oeffnen = 1</tspan></text>
  <text x="1090" y="525" text-anchor="middle" font-size="18"><tspan fill="#333333">(TuerAufCmd)</tspan></text>
  <rect x="511" y="441" width="258" height="110" rx="27" fill="#fff0dc" stroke="#c26a00" stroke-width="2"/>
  <text x="640" y="477" text-anchor="middle" font-size="22"><tspan font-weight="bold" fill="#111111">Tür offen</tspan></text>
  <text x="640" y="501" text-anchor="middle" font-size="18"><tspan fill="#333333">EndlageAuf, Timer 5 s</tspan></text>
  <text x="640" y="525" text-anchor="middle" font-size="18"><tspan fill="#333333">(hält bei Lichtschranke)</tspan></text>
  <rect x="61" y="441" width="258" height="110" rx="27" fill="#fff0dc" stroke="#c26a00" stroke-width="2"/>
  <text x="190" y="477" text-anchor="middle" font-size="22"><tspan font-weight="bold" fill="#111111">Tür schließt</tspan></text>
  <text x="190" y="501" text-anchor="middle" font-size="18"><tspan fill="#333333">Schliessen = 1</tspan></text>
  <text x="190" y="525" text-anchor="middle" font-size="18"><tspan fill="#333333">(TuerZuCmd)</tspan></text>
  <text x="640" y="118" text-anchor="middle" font-size="19"><tspan fill="#222222">Ziel in der Liste</tspan></text>
  <text x="640" y="142" text-anchor="middle" font-size="19"><tspan fill="#222222">HatZiel und EnableGondel</tspan></text>
  <text x="868" y="329" text-anchor="end" font-size="19"><tspan fill="#222222">Ruf im aktuellen Stock</tspan></text>
  <text x="868" y="353" text-anchor="end" font-size="19"><tspan fill="#222222">oder Tür-auf-Taster</tspan></text>
  <text x="1102" y="317" text-anchor="start" font-size="19"><tspan fill="#222222">Done:</tspan></text>
  <text x="1102" y="341" text-anchor="start" font-size="19"><tspan fill="#222222">Ziel erreicht,</tspan></text>
  <text x="1102" y="365" text-anchor="start" font-size="19"><tspan fill="#222222">Ziel löschen</tspan></text>
  <text x="865" y="544" text-anchor="middle" font-size="19"><tspan fill="#222222">EndlageAuf</tspan></text>
  <text x="415" y="457" text-anchor="middle" font-size="19"><tspan fill="#222222">nach 5 s oder</tspan></text>
  <text x="415" y="481" text-anchor="middle" font-size="19"><tspan fill="#222222">Tür-zu-Taster</tspan></text>
  <text x="178" y="329" text-anchor="end" font-size="19"><tspan fill="#222222">EndlageZu,</tspan></text>
  <text x="178" y="353" text-anchor="end" font-size="19"><tspan fill="#222222">kein Ziel</tspan></text>
  <text x="640" y="29" text-anchor="middle" font-size="19"><tspan fill="#222222">EndlageZu und Ziel in der Liste</tspan></text>
  <text x="640" y="645" text-anchor="middle" font-size="19"><tspan fill="#222222">Lichtschranke oder Tür-auf-Taster</tspan></text>
  <rect x="61" y="681" width="1158" height="70" rx="5" fill="#efefef" stroke="#222222" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="640" y="709" text-anchor="middle" font-size="18"><tspan font-weight="bold" fill="#111111">In jedem Zustand:</tspan><tspan fill="#222222"> Ein neuer Ruf wird von AddTargetToList in die Zielliste einsortiert.</tspan></text>
  <text x="640" y="733" text-anchor="middle" font-size="18"><tspan fill="#222222">Liegt er im aktuellen Stock, kommt stattdessen TuerAufCmd.</tspan></text>
  <rect x="1121" y="55" width="28" height="18" rx="5" fill="#e3eefa" stroke="#1f5fa8" stroke-width="2"/>
  <text x="1158" y="69" text-anchor="start" font-size="18"><tspan fill="#222222">Fahrlogik</tspan></text>
  <rect x="1121" y="85" width="28" height="18" rx="5" fill="#fff0dc" stroke="#c26a00" stroke-width="2"/>
  <text x="1158" y="99" text-anchor="start" font-size="18"><tspan fill="#222222">Türlogik</tspan></text>
</svg>
